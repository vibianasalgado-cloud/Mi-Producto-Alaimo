<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin</title>
<script>
(function(){
  try{
    var stored = localStorage.getItem('nequi-theme');
    var theme = stored || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF4F8;
    --ink:#1B0221;
    --ink-soft:#6E5A72;
    --magenta:#DA0081;
    --magenta-deep:#A5005F;
    --blue:#5A9EFB;
    --line:rgba(27,2,33,0.13);
    --surface:#FFFFFF;
    --radius:20px;
  }
  :root[data-theme="dark"]{
    --paper:#150116;
    --ink:#F6EAF4;
    --ink-soft:#BB9EBC;
    --line:rgba(255,255,255,0.14);
    --surface:#241228;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;padding:24px 20px 56px;
  }
  [hidden]{display:none !important;}
  .wrap{max-width:1120px;margin-inline:auto;}
  h1{font-size:1.5rem;font-weight:800;margin:0;}
  h2{font-size:1.15rem;font-weight:800;margin:0;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:999px;font-family:inherit;font-weight:700;font-size:.9rem;
    cursor:pointer;padding:.75em 1.4em;transition:transform .15s ease, background .15s ease;
  }
  .btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  .btn:active{transform:scale(.97);}
  .btn[disabled]{opacity:.6;cursor:progress;}
  .btn-primary{background:var(--magenta);color:#fff;}
  .btn-primary:hover{background:var(--magenta-deep);}
  .btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--ink-soft);}

  .login{
    max-width:400px;margin:12vh auto 0;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);padding:32px 28px;
    display:flex;flex-direction:column;gap:12px;
  }
  .login label{font-weight:700;font-size:.85rem;}
  .login input{
    width:100%;font-family:inherit;font-size:.95rem;padding:.8em 1em;border-radius:14px;
    border:1.5px solid var(--line);background:var(--paper);color:var(--ink);
  }
  .login input:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  .msg{font-size:.9rem;font-weight:600;min-height:1.4em;margin:0;}
  .msg.err{color:#C62828;}
  :root[data-theme="dark"] .msg.err{color:#FFB4B4;}

  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px;}
  .top .who{color:var(--ink-soft);font-size:.85rem;}
  .block{margin-bottom:40px;}
  .block-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
  .count{color:var(--ink-soft);font-weight:600;font-size:.9rem;}
  .table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);}
  table{width:100%;border-collapse:collapse;font-size:.9rem;}
  th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top;}
  th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  td.fecha{white-space:nowrap;color:var(--ink-soft);}
  td.mensaje{min-width:220px;overflow-wrap:anywhere;}
  td.vacio{color:var(--ink-soft);text-align:center;padding:24px;}
</style>
</head>
<body>
<div class="wrap">

  <form class="login" id="login" hidden>
    <h1>Admin</h1>
    <label for="email">Correo</label>
    <input type="email" id="email" required autocomplete="username">
    <label for="password">Contraseña</label>
    <input type="password" id="password" required autocomplete="current-password">
    <button type="submit" class="btn btn-primary">Entrar</button>
    <p class="msg" id="login-msg" role="status" aria-live="polite"></p>
  </form>

  <div id="panel" hidden>
    <div class="top">
      <div>
        <h1>Admin</h1>
        <span class="who" id="who"></span>
      </div>
      <button type="button" class="btn btn-ghost" id="logout">Cerrar sesión</button>
    </div>

    <section class="block">
      <div class="block-head">
        <h2>Signups <span class="count" id="signups-count"></span></h2>
        <button type="button" class="btn btn-primary" id="csv">Descargar CSV</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Fecha</th><th>Correo</th><th>Mensaje</th></tr></thead>
          <tbody id="signups-body"></tbody>
        </table>
      </div>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>Feedback <span class="count" id="feedback-count"></span></h2>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Fecha</th><th>Correo</th><th>Comentario</th></tr></thead>
          <tbody id="feedback-body"></tbody>
        </table>
      </div>
    </section>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function(){
  var cfg = window.SUPABASE_CONFIG;
  var client = (cfg && window.supabase) ? window.supabase.createClient(cfg.url, cfg.anonKey) : null;
  var $ = function(id){ return document.getElementById(id); };
  var signupsRows = [];

  function fmt(iso){
    return new Date(iso).toLocaleString('es-CO', {dateStyle:'medium', timeStyle:'short'});
  }

  function fill(tbodyId, countId, rows, cols){
    var tb = $(tbodyId);
    tb.textContent = '';
    $(countId).textContent = '(' + rows.length + ')';
    if(!rows.length){
      var tr = document.createElement('tr'), td = document.createElement('td');
      td.colSpan = 3; td.className = 'vacio'; td.textContent = 'Todavía no hay registros.';
      tr.appendChild(td); tb.appendChild(tr); return;
    }
    rows.forEach(function(r){
      var tr = document.createElement('tr');
      cols.forEach(function(c){
        var td = document.createElement('td');
        td.className = c.cls;
        td.textContent = c.get(r);
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
  }

  var COLS = [
    {cls:'fecha',   get:function(r){ return fmt(r.created_at); }},
    {cls:'email',   get:function(r){ return r.email || '—'; }},
    {cls:'mensaje', get:function(r){ return r.mensaje; }}
  ];

  function showLogin(text){
    $('panel').hidden = true;
    $('login').hidden = false;
    signupsRows = [];
    $('signups-body').textContent = '';
    $('feedback-body').textContent = '';
    if(text !== undefined){ $('login-msg').textContent = text; $('login-msg').className = 'msg err'; }
  }

  function loadData(session){
    $('who').textContent = session.user.email;
    return Promise.all([
      client.from('signups').select('*').order('created_at', {ascending:false}).limit(1000),
      client.from('feedback').select('*').order('created_at', {ascending:false}).limit(1000)
    ]).then(function(res){
      if(res[0].error || res[1].error){
        showLogin('No se pudieron cargar los datos. Intenta entrar de nuevo.');
        return client.auth.signOut();
      }
      signupsRows = res[0].data;
      fill('signups-body', 'signups-count', signupsRows, COLS);
      fill('feedback-body', 'feedback-count', res[1].data, COLS);
      $('login').hidden = true;
      $('panel').hidden = false;
    });
  }

  function csvCell(v){
    var s = v == null ? '' : String(v);
    if(/^[=+\-@\t\r]/.test(s)) s = "'" + s; // evita fórmulas en Excel
    return '"' + s.replace(/"/g, '""') + '"';
  }

  $('csv').addEventListener('click', function(){
    var lines = [['id','correo','mensaje','fecha'].map(csvCell).join(',')];
    signupsRows.forEach(function(r){
      lines.push([r.id, r.email, r.mensaje, r.created_at].map(csvCell).join(','));
    });
    var blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'signups.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });

  $('login').addEventListener('submit', function(ev){
    ev.preventDefault();
    if(!client){ showLogin('No se pudo conectar con Supabase.'); return; }
    var btn = ev.target.querySelector('button');
    btn.disabled = true;
    $('login-msg').textContent = 'Entrando…'; $('login-msg').className = 'msg';
    client.auth.signInWithPassword({email:$('email').value.trim(), password:$('password').value}).then(function(res){
      if(res.error || !res.data.session){
        showLogin('Correo o contraseña incorrectos.');
        return;
      }
      $('password').value = '';
      $('login-msg').textContent = '';
      return loadData(res.data.session);
    }).then(function(){ btn.disabled = false; }, function(){
      btn.disabled = false; showLogin('No se pudo conectar. Intenta de nuevo.');
    });
  });

  $('logout').addEventListener('click', function(){
    client.auth.signOut().then(function(){ showLogin(); $('login-msg').textContent = ''; });
  });

  if(!client){ $('login').hidden = false; $('login-msg').textContent = 'No se pudo cargar Supabase.'; $('login-msg').className = 'msg err'; return; }
  client.auth.getSession().then(function(res){
    if(res.data.session){ return loadData(res.data.session); }
    showLogin();
  }, function(){ showLogin(); });
})();
</script>
</body>
</html>
